<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wireframe Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3B82F6",
                        "background-light": "#F8FAFC",
                        "background-dark": "#0F172A",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1E293B",
                        "border-light": "#E2E8F0",
                        "border-dark": "#334155",
                        "text-primary-light": "#0F172A",
                        "text-primary-dark": "#F8FAFC",
                        "text-secondary-light": "#64748B",
                        "text-secondary-dark": "#94A3B8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="flex flex-1 justify-center p-4 sm:p-6 md:p-8">
<div class="layout-content-container flex flex-col w-full max-w-2xl flex-1">
<div class="flex flex-col space-y-6">
<div class="space-y-6 rounded-xl bg-surface-light dark:bg-surface-dark p-6 border border-border-light dark:border-border-dark">
<h3 class="text-lg font-semibold text-text-primary-light dark:text-text-primary-dark">Grid &amp; Snapping</h3>
<div class="space-y-4">
<div class="flex items-center justify-between">
<label class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark" for="show-grid">Show Grid</label>
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-primary transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:ring-offset-background-dark" id="show-grid" role="switch" type="button">
<span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark" for="grid-spacing">Grid Spacing</label>
<div class="relative">
<input class="form-input w-full rounded-lg border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark/50 focus:border-primary focus:ring-primary/50 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark/70 px-3 py-2 text-sm pr-8" id="grid-spacing" type="number" value="10"/>
<span class="absolute inset-y-0 right-3 flex items-center text-sm text-text-secondary-light dark:text-text-secondary-dark pointer-events-none">px</span>
</div>
</div>
<div class="flex items-start gap-3">
<input checked="" class="form-checkbox h-5 w-5 rounded border-border-light dark:border-border-dark text-primary focus:ring-primary/50 mt-0.5" id="snap-to-grid" type="checkbox"/>
<div>
<label class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark" for="snap-to-grid">Snap to Grid</label>
<p class="text-xs text-text-secondary-light dark:text-text-secondary-dark">Automatically align objects to the grid lines.</p>
</div>
</div>
</div>
</div>
<div class="space-y-4 rounded-xl bg-surface-light dark:bg-surface-dark p-6 border border-border-light dark:border-border-dark">
<h3 class="text-lg font-semibold text-text-primary-light dark:text-text-primary-dark">View Options</h3>
<div class="space-y-4">
<div class="flex items-start gap-3">
<input class="form-checkbox h-5 w-5 rounded border-border-light dark:border-border-dark text-primary focus:ring-primary/50 mt-0.5" id="show-bounding-boxes" type="checkbox"/>
<div>
<label class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark" for="show-bounding-boxes">Show Bounding Boxes</label>
<p class="text-xs text-text-secondary-light dark:text-text-secondary-dark">Display outlines for all content elements.</p>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark" for="wireframe-mode">Wireframe Mode</label>
<select class="form-select w-full rounded-lg border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark/50 focus:border-primary focus:ring-primary/50 px-3 py-2 text-sm" id="wireframe-mode">
<option value="simple">Simple</option>
<option selected="" value="detailed">Detailed</option>
</select>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark" for="zoom-level">Zoom Level</label>
<div class="flex items-center gap-3">
<input class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer [&amp;::-webkit-slider-thumb]:appearance-none [&amp;::-webkit-slider-thumb]:h-4 [&amp;::-webkit-slider-thumb]:w-4 [&amp;::-webkit-slider-thumb]:rounded-full [&amp;::-webkit-slider-thumb]:bg-primary" id="zoom-level" max="200" min="50" type="range" value="100"/>
<div class="relative w-20">
<input class="form-input w-full rounded-lg border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark/50 focus:border-primary focus:ring-primary/50 px-2 py-2 text-sm text-center" id="zoom-input" type="number" value="100"/>
<span class="absolute inset-y-0 right-2.5 flex items-center text-sm text-text-secondary-light dark:text-text-secondary-dark pointer-events-none">%</span>
</div>
</div>
</div>
</div>
</div>
<details class="group rounded-xl bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark" open="">
<summary class="flex cursor-pointer list-none items-center justify-between gap-4 p-6">
<h3 class="text-lg font-semibold text-text-primary-light dark:text-text-primary-dark">Layer Visibility</h3>
<div class="text-text-secondary-light dark:text-text-secondary-dark transition-transform duration-200 group-open:rotate-180">
<span class="material-symbols-outlined">expand_more</span>
</div>
</summary>
<div class="px-6 pb-6">
<div class="flex flex-col divide-y divide-border-light dark:divide-border-dark border-y border-border-light dark:border-border-dark">
<div class="flex items-center justify-between py-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark text-xl">image</span>
<span class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Images</span>
</div>
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-primary transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:ring-offset-background-dark" role="switch" type="button">
<span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>
<div class="flex items-center justify-between py-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark text-xl">title</span>
<span class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Text Blocks</span>
</div>
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-primary transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:ring-offset-background-dark" role="switch" type="button">
<span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>
<div class="flex items-center justify-between py-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark text-xl">smart_button</span>
<span class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Buttons &amp; Links</span>
</div>
<button aria-checked="false" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-slate-200 dark:bg-slate-700 transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:ring-offset-background-dark" role="switch" type="button">
<span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-0"></span>
</button>
</div>
<div class="flex items-center justify-between py-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark text-xl">data_object</span>
<span class="text-sm font-medium text-text-primary-light dark:text-text-primary-dark">Containers</span>
</div>
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-primary transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:ring-offset-background-dark" role="switch" type="button">
<span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out translate-x-5"></span>
</button>
</div>
</div>
</div>
</details>
</div>
</div>
</div>
</div>
</div>

</body></html>
