<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Advanced Properties - Utility Section</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3B82F6", // Primary Blue from user request
                        "background-light": "#F8FAFC", // Light Gray / Off-White
                        "background-dark": "#101622", // Default dark
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="flex flex-1 justify-center p-4 sm:p-6 md:p-8">
<div class="layout-content-container flex flex-col w-full max-w-2xl flex-1">
<div class="flex flex-col gap-4">
<h3 class="text-xl font-semibold text-[#1E293B] dark:text-white px-2">Advanced</h3>
<div class="flex flex-col gap-3">
<details class="flex flex-col rounded-xl border border-[#E2E8F0] dark:border-[#334155] bg-white dark:bg-[#1E293B]/40 px-4 group" open="">
<summary class="flex cursor-pointer list-none items-center justify-between gap-4 py-4">
<p class="text-[#1E293B] dark:text-white text-base font-semibold leading-normal">Utility (Surcharges / Fees)</p>
<div class="text-[#64748B] dark:text-[#94A3B8] transition-transform duration-200 group-open:rotate-180">
<span class="material-symbols-outlined">expand_more</span>
</div>
</summary>
<div class="pb-4 space-y-5">
<div class="flex flex-col gap-2">
<label class="text-[#1E293B] dark:text-white text-sm font-medium" for="rate">Rate (rate)</label>
<input class="form-input w-full rounded-lg text-[#1E293B] dark:text-white border-[#E2E8F0] dark:border-[#334155] bg-white dark:bg-[#1E293B]/20 focus:border-primary focus:ring-primary/50 placeholder:text-[#94A3B8] p-3 text-sm font-normal h-10" id="rate" placeholder="Enter rate" type="number"/>
<p class="text-[#94A3B8] text-xs font-normal">field.meta.utility.rate</p>
</div>
<div class="flex flex-col gap-2">
<label class="text-[#1E293B] dark:text-white text-sm font-medium" for="utility-mode">Mode (mode)</label>
<select class="form-select w-full rounded-lg text-[#1E293B] dark:text-white border-[#E2E8F0] dark:border-[#334155] bg-white dark:bg-[#1E293B]/20 focus:border-primary focus:ring-primary/50 p-3 text-sm font-normal h-10" id="utility-mode">
<option>flat</option>
<option>per_quantity</option>
<option selected="" value="per_value">per_value</option>
<option>percent</option>
</select>
<p class="text-[#94A3B8] text-xs font-normal">field.meta.utility.mode</p>
</div>
<div class="flex flex-col gap-2">
<label class="text-[#1E293B] dark:text-white text-sm font-medium" for="value-source">Value source (valueBy)</label>
<select class="form-select w-full rounded-lg text-[#1E293B] dark:text-white border-[#E2E8F0] dark:border-[#334155] bg-white dark:bg-[#1E293B]/20 focus:border-primary focus:ring-primary/50 p-3 text-sm font-normal h-10" id="value-source">
<option>value</option>
<option>length</option>
</select>
<p class="text-[#94A3B8] text-xs font-normal">field.meta.utility.valueBy</p>
</div>
<div class="hidden flex-col gap-2">
<label class="text-[#1E293B] dark:text-white text-sm font-medium" for="percent-base">Percent base (percentBase)</label>
<select class="form-select w-full rounded-lg text-[#1E293B] dark:text-white border-[#E2E8F0] dark:border-[#334155] bg-white dark:bg-[#1E293B]/20 focus:border-primary focus:ring-primary/50 p-3 text-sm font-normal h-10" id="percent-base">
<option>service_total</option>
<option>base_service</option>
<option>all</option>
</select>
<p class="text-[#94A3B8] text-xs font-normal">field.meta.utility.percentBase</p>
</div>
<div class="flex flex-col gap-2">
<label class="text-[#1E293B] dark:text-white text-sm font-medium" for="label">Label (label)</label>
<input class="form-input w-full rounded-lg text-[#1E293B] dark:text-white border-[#E2E8F0] dark:border-[#334155] bg-white dark:bg-[#1E293B]/20 focus:border-primary focus:ring-primary/50 placeholder:text-[#94A3B8] p-3 text-sm font-normal h-10" id="label" placeholder="e.g. Service Fee" type="text"/>
<p class="text-[#94A3B8] text-xs font-normal">field.meta.utility.label</p>
</div>
</div>
</details>
</div>
</div>
</div>
</div>
</div>
</div>

</body></html>
