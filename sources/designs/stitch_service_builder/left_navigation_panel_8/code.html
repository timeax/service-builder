<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Safe Context Filter Popover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#111111",
                        "text-light-primary": "#111827",
                        "text-dark-primary": "#F9FAFB",
                        "text-light-secondary": "#6B7280",
                        "text-dark-secondary": "#A1A1AA",
                        "border-light": "#E5E7EB",
                        "border-dark": "#27272A",
                        "hover-light": "#F3F4F6",
                        "hover-dark": "#18181B",
                        "selected-light": "#EEF2FF",
                        "selected-dark": "#222144"
                    },
                    fontFamily: {
                        display: "Inter",
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace']
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    }
                }
            }
        };
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 300,
                'GRAD' 0,
                'opsz' 20;
            font-size: 20px;
        }
    </style>
</head>
<body class="bg-background-light font-display antialiased">
<div class="flex h-screen w-full items-center justify-center p-4">
<div class="flex w-full max-w-sm flex-col rounded-xl border border-border-light bg-surface-light shadow-2xl shadow-black/20" x-data="{ mode: 'all' }">
<div class="border-b border-border-light p-4">
<h3 class="text-base font-semibold leading-6 text-text-light-primary">Safe Context Filter</h3>
<p class="mt-1 text-sm text-text-light-secondary">Define the evaluation context for services.</p>
</div>
<div class="flex-grow space-y-5 overflow-y-auto p-4">
<section>
<h4 class="text-sm font-semibold text-text-light-primary">Tags</h4>
<div class="mt-3 space-y-2">
<label class="flex items-center gap-3 text-sm font-medium text-text-light-primary cursor-pointer">
<input checked="" class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/> Site Builder (Workspace)
                        </label>
<label class="flex items-center gap-3 text-sm text-text-light-primary cursor-pointer">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/> Content Management
                        </label>
<label class="flex items-center gap-3 text-sm text-text-light-primary cursor-pointer">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/> E-commerce
                        </label>
<label class="flex items-center gap-3 text-sm text-text-light-primary cursor-pointer">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/> Extras
                        </label>
</div>
<div class="mt-4 flex items-center rounded-lg bg-gray-100 p-1 text-sm">
<button :class="{'bg-white shadow-sm font-medium text-gray-800': mode === 'all', 'text-text-light-secondary hover:bg-gray-200/50': mode !== 'all'}" @click="mode = 'all'" class="flex-1 rounded-md px-2 py-1 transition-all duration-200">All selected</button>
<button :class="{'bg-white shadow-sm font-medium text-gray-800': mode === 'any', 'text-text-light-secondary hover:bg-gray-200/50': mode !== 'any'}" @click="mode = 'any'" class="flex-1 rounded-md px-2 py-1 transition-all duration-200">Any selected</button>
</div>
</section>
<div class="h-px bg-border-light"></div>
<section>
<h4 class="text-sm font-semibold text-text-light-primary">Buttons (Context Options)</h4>
<div class="mt-3 space-y-3">
<details class="group" open="">
<summary class="flex cursor-pointer list-none items-center gap-2 text-sm font-medium text-text-light-primary">
<span class="material-symbols-outlined text-text-light-secondary transition-transform duration-200 group-open:rotate-90" style="font-size: 20px;">chevron_right</span>
                                CMS Features
                            </summary>
<div class="space-y-2 pt-2 pl-7">
<label class="flex items-center gap-3 text-sm text-text-light-primary cursor-pointer">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/> Basic CMS
                                </label>
<label class="flex items-center gap-3 text-sm text-text-light-primary cursor-pointer">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/> Advanced CMS
                                </label>
</div>
</details>
<div class="pl-2.5">
<label class="flex items-center gap-3 text-sm text-text-light-primary cursor-pointer">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/> Assume selected
                                <span class="text-text-light-secondary ml-1">(Payment Gateway)</span>
</label>
</div>
</div>
</section>
<div class="h-px bg-border-light"></div>
<section>
<h4 class="text-sm font-semibold text-text-light-primary">Safety Toggles</h4>
<div class="mt-3 space-y-2">
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 text-sm text-text-light-primary cursor-pointer">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/> Strict safety
                            </label>
<div class="relative group">
<span class="material-symbols-outlined cursor-help text-text-light-secondary/80" style="font-size: 18px;">info</span>
<div class="pointer-events-none absolute bottom-full mb-2 w-60 rounded-md bg-gray-800 px-3 py-2 text-xs font-medium text-white opacity-0 transition-opacity group-hover:opacity-100 left-1/2 -translate-x-1/2">
                                    Omit services causing rate mismatches or utility services lacking a visible base.
                                    <div class="absolute top-full left-1/2 h-0 w-0 -translate-x-1/2 border-x-4 border-x-transparent border-t-4 border-t-gray-800"></div>
</div>
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 text-sm text-text-light-primary cursor-pointer">
<input class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary focus:ring-offset-0" type="checkbox"/> Enforce policies
                            </label>
<div class="relative group">
<span class="material-symbols-outlined cursor-help text-text-light-secondary/80" style="font-size: 18px;">info</span>
<div class="pointer-events-none absolute bottom-full mb-2 w-60 rounded-md bg-gray-800 px-3 py-2 text-xs font-medium text-white opacity-0 transition-opacity group-hover:opacity-100 left-1/2 -translate-x-1/2">
                                    Omit services implicated by policy violations.
                                    <div class="absolute top-full left-1/2 h-0 w-0 -translate-x-1/2 border-x-4 border-x-transparent border-t-4 border-t-gray-800"></div>
</div>
</div>
</div>
</div>
</section>
</div>
<div class="flex flex-shrink-0 items-center justify-end gap-3 border-t border-border-light bg-gray-50 p-4">
<button class="rounded-lg border border-border-light bg-white px-4 py-2 text-sm font-semibold text-text-light-primary shadow-sm hover:bg-hover-light transition-colors">Reset</button>
<button class="rounded-lg border border-transparent bg-primary px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 transition-colors">Apply</button>
</div>
</div>
</div>
<script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</body></html>
