<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Option Node Component</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#135bec",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 20
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-screen w-full flex-col items-center justify-center p-8">
<div class="w-full max-w-4xl rounded-xl bg-white dark:bg-zinc-900/50 p-8 shadow-sm">
<div class="mb-8 text-center">
<h1 class="text-2xl font-bold text-slate-800 dark:text-slate-200">Option Node States</h1>
<p class="mt-2 text-slate-500 dark:text-slate-400">A simplified representation of an option node for a flow map canvas.</p>
</div>
<div class="grid grid-cols-1 gap-x-8 gap-y-12 sm:grid-cols-2 lg:grid-cols-4">
<div class="space-y-4">
<h2 class="text-sm font-semibold text-slate-600 dark:text-slate-400 text-center">Default State</h2>
<div class="flex h-32 items-center justify-center rounded-lg border border-dashed border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/20">
<div class="flex h-10 cursor-pointer items-center justify-center gap-2 rounded-full border border-slate-300 bg-white px-4 py-2 shadow-sm transition-all duration-200 ease-in-out dark:border-slate-700 dark:bg-slate-900">
<span class="material-symbols-outlined !text-[8px] text-slate-400 dark:text-slate-500">circle</span>
<p class="whitespace-nowrap text-sm font-medium text-slate-800 dark:text-slate-200">Yes</p>
</div>
</div>
</div>
<div class="space-y-4">
<h2 class="text-sm font-semibold text-slate-600 dark:text-slate-400 text-center">Hover State</h2>
<div class="flex h-32 items-center justify-center rounded-lg border border-dashed border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/20">
<div class="flex h-10 cursor-pointer items-center justify-center gap-2 rounded-full border border-slate-300 bg-slate-100 px-4 py-2 shadow-sm transition-all duration-200 ease-in-out dark:border-slate-600 dark:bg-slate-800">
<span class="material-symbols-outlined !text-[8px] text-slate-400 dark:text-slate-500">circle</span>
<p class="whitespace-nowrap text-sm font-medium text-slate-800 dark:text-slate-200">Standard Shipping</p>
</div>
</div>
</div>
<div class="space-y-4">
<h2 class="text-sm font-semibold text-slate-600 dark:text-slate-400 text-center">Selected State</h2>
<div class="flex h-32 items-center justify-center rounded-lg border border-dashed border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/20">
<div class="flex h-10 cursor-pointer items-center justify-center gap-2 rounded-full border-2 border-primary bg-primary/10 px-4 py-2 shadow-sm transition-all duration-200 ease-in-out dark:bg-primary/20">
<span class="material-symbols-outlined !text-[8px] text-primary dark:text-blue-300">circle</span>
<p class="whitespace-nowrap text-sm font-medium text-primary dark:text-blue-300">No</p>
</div>
</div>
</div>
<div class="space-y-4">
<h2 class="text-sm font-semibold text-slate-600 dark:text-slate-400 text-center">Dragging State</h2>
<div class="flex h-32 items-center justify-center rounded-lg border border-dashed border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/20">
<div class="flex h-10 cursor-grabbing items-center justify-center gap-2 rounded-full border border-slate-300 bg-white px-4 py-2 opacity-50 shadow-lg transition-all duration-200 ease-in-out dark:border-slate-700 dark:bg-slate-900">
<span class="material-symbols-outlined !text-[8px] text-slate-400 dark:text-slate-500">circle</span>
<p class="whitespace-nowrap text-sm font-medium text-slate-800 dark:text-slate-200">Credit Card</p>
</div>
</div>
</div>
</div>
</div>
</div>
</body></html>
